name: Python CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Step 3: Fix requirements.txt encoding (self-healing)
      - name: Normalize requirements encoding
        run: |
          if file requirements.txt | grep -q "UTF-16"; then
            echo "Converting requirements.txt from UTF-16 to UTF-8"
            iconv -f utf-16 -t utf-8 requirements.txt -o requirements.txt
          fi

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest black ruff mypy

      # Step 5: Check formatting
      - name: Check formatting (Black)
        run: black --check .

      # Step 6: Lint
      - name: Run Ruff linter
        run: ruff check .

      # Step 7: Run tests
      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -q

      # Step 8: Type checking
      - name: Run mypy
        run: mypy .
